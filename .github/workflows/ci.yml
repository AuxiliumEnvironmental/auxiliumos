name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run os:verify -- controls
      - run: npm run os:verify -- package-importer
      - run: npm run os:verify -- foundation-contract
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repository-check-evidence
          path: docs/00-control/evidence/
  application-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run os:verify -- directory-database
      - run: npm run os:verify -- access-audit-database
      - run: npm run os:verify -- private-object-reservations-database
      - run: npm run os:verify -- api-fixture-safety
      - run: npm run os:verify -- runtime-build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run os:verify -- directory-browser-fixture
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            docs/00-control/evidence/
# Local database tests use simulated Auth claims; UI tests use HTTP fixtures.
# These jobs do not establish genuine hosted Auth/API or full-system acceptance.
