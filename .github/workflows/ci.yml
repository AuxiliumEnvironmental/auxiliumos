name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run os:verify -- controls
      - run: npm run os:verify -- package-importer
      - run: npm run os:verify -- foundation-contract
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repository-check-evidence
          path: docs/00-control/evidence/
  static-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
# These jobs verify current controls/static artifacts, not the unimplemented OS runtime.
